name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Build with Quartz
        run: npm run build
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
          retention-days: 1

  spell:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - name: Install dependencies
        run: npm ci
      - name: Run cspell
        run: npx cspell "content/**/*.md" --no-progress --config cspell.json

  link-check:
    name: Link Check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: public
      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-cache-${{ github.run_id }}
          restore-keys: lychee-cache-
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --cache
            --cache-exclude-status 429
            --max-concurrency 4
            --timeout 10
            --max-retries 1
            --exclude-loopback
            --exclude ".*\.xml$"
            --exclude "git\.calebe\.dev\.br"
            --exclude "youtube\.com"
            --exclude "youtu\.be"
            --exclude "linkedin\.com"
            --exclude "instagram\.com"
            --exclude ".*\.pdf$"
            "public/**/*.html"
          fail: true
